<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eCatalog — Public Catalog</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <h1>eCatalog Azerbaijan</h1>
          <p>Compare approved offers from multiple sellers. Curated and published by admin.</p>
        </div>
        <a class="admin-link" href="/admin">Open Admin Panel</a>
      </header>

      <section class="card">
        <h2>Catalog filters</h2>
        <form id="filter-form" class="grid-form">
          <input name="search" placeholder="Search title" />
          <input name="category" placeholder="Category" />
          <input name="city" placeholder="City" />
          <input name="min_price" type="number" min="0" step="0.01" placeholder="Min AZN" />
          <input name="max_price" type="number" min="0" step="0.01" placeholder="Max AZN" />
          <select name="condition">
            <option value="">Any condition</option>
            <option value="new">New</option>
            <option value="used">Used</option>
            <option value="refurbished">Refurbished</option>
          </select>
          <button type="submit">Apply filters</button>
        </form>
      </section>

      <section class="card">
        <h2>Public catalog</h2>
        <div id="catalog-grid" class="catalog-grid"></div>
      </section>
    </main>

    <script src="/web/app.js"></script>
  </body>
</html>
